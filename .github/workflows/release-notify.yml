name: Announce release

# Posts a release-notes embed to the Discord #releases channel whenever a PR
# merges into main. This announces the merge, not a site deploy — deploys
# (wrangler deploy) stay a manual, deliberate step per HOSTING.md.
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  notify:
    name: Post to Discord #releases
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Notify Discord
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_NOTES: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: node tools/notify_release.js
