name: Announce an existing release

# Recovery only. Normal releases use npm run release, which deploys first and then announces.
on:
  workflow_dispatch:
    inputs:
      notes_file:
        description: Repository path to notes for an already successfully deployed release
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Publish release notes to Discord
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          NOTES_FILE: ${{ inputs.notes_file }}
        run: node tools/notify_release.js --notes-file "$NOTES_FILE"
