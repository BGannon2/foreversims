name: Watch Forever data sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  watch:
    name: Check wago.tools build + foreverchanges.pro snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run data watch
        id: watch
        run: python tools/data_watch.py
      - name: Open a PR if something moved
        id: cpr
        if: steps.watch.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "data: Forever source snapshot changed"
          branch: data-watch/snapshot
          delete-branch: true
          title: "data-change: Forever source snapshot changed"
          labels: data-change
          assignees: BGannon2
          reviewers: BGannon2
          body: |
            `tools/data_watch.py` found that wago.tools' newest `wow_classic_beta` build and/or
            foreverchanges.pro's banner build tag or item/talent counts moved since the last
            recorded snapshot (`data/.watch_state.json`, updated by this PR).

            This does **not** mean anything in the sim is wrong yet -- it means new data is
            available to check. Before merging:

            - [ ] Compare the old vs. new `data/.watch_state.json` values in this diff.
            - [ ] If the wago.tools build changed, re-run `tools/fetch_forever_items.py` and
                  spot-check any abilities sourced from `SpellEffect`/`TraitDefinitionEffectPoints`
                  with `tools/spell_curve.py <spell_id>` against the new build.
            - [ ] If foreverchanges.pro's item/talent counts changed independently of the build
                  number, it re-parsed something -- check `docs`/`forever_talents_all.json`
                  provenance for staleness.
            - [ ] Re-run the full pipeline (`export_static_data.py`, `build_engine.sh`,
                  `generate_benchmarks.py`) only after confirming what actually needs updating.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)

      - name: Run CI on the PR branch
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref data-watch/snapshot --repo "$GITHUB_REPOSITORY"

      - name: Notify Discord (optional)
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          WEBHOOK: ${{ secrets.DATA_WATCH_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          OP: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "DATA_WATCH_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg c "Forever data-watch PR $OP: $PR_URL" '{content:$c}' | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"
