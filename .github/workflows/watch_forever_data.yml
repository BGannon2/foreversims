name: Watch Forever data sources

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  watch:
    name: Check the live and beta Forever client builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run data watch
        id: watch
        run: python tools/data_watch.py
      # The sim follows the client chosen by PIN in tools/data_watch.py. A new build of it: diff it
      # against the pinned one and, if any table the sim reads changed, re-pin the client data and
      # regenerate everything that depends on it. Beta builds are only previewed (last step).
      - name: Compare the new live client build
        id: refresh
        if: steps.watch.outputs.pin_changed == 'true'
        continue-on-error: true
        env:
          NEW_BUILD: ${{ steps.watch.outputs.pin_build }}
        run: python tools/build_update_report.py "$NEW_BUILD" --apply --out "$RUNNER_TEMP/report.md"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.refresh.outputs.client_changed == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        if: steps.refresh.outputs.client_changed == 'true'
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: actions/setup-node@v7
        if: steps.refresh.outputs.client_changed == 'true'
        with:
          node-version: "22"

      - name: Regenerate engine, BiS sets and benchmarks
        id: regen
        if: steps.refresh.outputs.client_changed == 'true'
        continue-on-error: true
        run: |
          bash tools/build_engine.sh
          python tools/wasm_parity.py
          python tools/build_bis_gearsets.py
          python tools/generate_benchmarks.py
          python tools/export_static_data.py
          python -m unittest discover -s tests -t .

      - name: Write the PR description
        if: steps.watch.outputs.pin_changed == 'true'
        env:
          NEW_BUILD: ${{ steps.watch.outputs.pin_build }}
          PIN_LABEL: ${{ steps.watch.outputs.pin_label }}
          CLIENT_CHANGED: ${{ steps.refresh.outputs.client_changed }}
          REGEN: ${{ steps.regen.outcome }}
        run: |
          {
            echo "\`tools/data_watch.py\` saw a new Forever client build on the pinned (**$PIN_LABEL**) branch."
            echo
            if [ "$CLIENT_CHANGED" = "true" ]; then
              echo "Client tables the sim reads changed in **$NEW_BUILD**, so this PR re-pins the client data and regenerates the engine, BiS sets and benchmarks."
              if [ "$REGEN" = "success" ]; then
                echo "Regeneration, browser parity and the test suite passed."
              else
                echo "**Regeneration or the tests failed** — see the workflow run. Something below needs a code change before merging."
              fi
            elif [ -n "$NEW_BUILD" ]; then
              echo "No table the sim reads changed in **$NEW_BUILD**; the client data stays pinned and nothing needs regenerating."
            fi
            echo
            if [ -f "$RUNNER_TEMP/report.md" ]; then cat "$RUNNER_TEMP/report.md"; fi
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the PR
        id: cpr
        if: steps.watch.outputs.pin_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: Forever ${{ steps.watch.outputs.pin_label }} client build ${{ steps.watch.outputs.pin_build }}"
          branch: data-watch/snapshot
          delete-branch: true
          title: "Forever ${{ steps.watch.outputs.pin_label }} client build ${{ steps.watch.outputs.pin_build }}"
          labels: data-change
          assignees: BGannon2
          reviewers: BGannon2
          body-path: ${{ runner.temp }}/pr-body.md

      # Bot-opened PRs get their pull_request CI run parked as "action_required"; the required
      # checks only count once that run is approved (a separately dispatched run doesn't satisfy them).
      - name: Approve the PR's CI run
        if: steps.cpr.outputs.pull-request-head-sha
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          for _ in $(seq 1 20); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$SHA"                    --json databaseId,conclusion --jq '[.[] | select(.conclusion == "action_required")][0].databaseId')
            if [ -n "$id" ] && [ "$id" != "null" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && echo "approved run $id" && exit 0
            fi
            sleep 6
          done
          echo "::warning::No action_required CI run found for $SHA; approve it from the PR's Checks tab."

      - name: Notify Discord (optional)
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          WEBHOOK: ${{ secrets.DATA_WATCH_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          OP: ${{ steps.cpr.outputs.pull-request-operation }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "DATA_WATCH_WEBHOOK_URL not set; skipping"; exit 0; }
          jq -n --arg c "Forever data-watch PR $OP: $PR_URL" '{content:$c}' | curl -fsS -H 'Content-Type: application/json' -d @- "$WEBHOOK"

      # Only while pinned to live: beta builds are never applied. Once per new beta build, publish a report-only issue diffing
      # it against the pinned live build (and close the previous preview), so upcoming changes are
      # visible ahead of time. Runs last so nothing it touches ends up in the re-pin PR.
      - name: Publish the beta preview
        if: always() && steps.watch.outputs.preview_build != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BETA: ${{ steps.watch.outputs.preview_build }}
        run: |
          title="Forever beta preview: $BETA"
          if gh issue list --repo "$GITHUB_REPOSITORY" --label beta-preview --state all --limit 50 --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Preview for $BETA already published"; exit 0
          fi
          python tools/build_update_report.py "$BETA" --out "$RUNNER_TEMP/beta.md"
          {
            echo "Beta build **$BETA** compared with the live client the sim is pinned to. **Nothing here is applied to the sim**; these changes land in a live re-pin PR when (and if) they ship."
            echo
            cat "$RUNNER_TEMP/beta.md"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/beta-issue.md"
          gh label create beta-preview --repo "$GITHUB_REPOSITORY" --color C5DEF5 --description "Report-only diff of a Forever beta build vs live" --force
          for old in $(gh issue list --repo "$GITHUB_REPOSITORY" --label beta-preview --state open --json number --jq '.[].number'); do
            gh issue close "$old" --repo "$GITHUB_REPOSITORY" --comment "Superseded by the preview for $BETA."
          done
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label beta-preview --body-file "$RUNNER_TEMP/beta-issue.md"
