name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run test suite
        run: python -m unittest discover -s tests -t .
      - name: Compile-check every Python source file
        run: python -m compileall -q forever server.py tools

  lint-python:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  lint-js:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx eslint .
      - run: npm run test:worker
      - run: npm run test:release

  lint-rust:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engine-rs/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('engine-rs/Cargo.lock') }}
      - name: cargo clippy
        working-directory: engine-rs
        run: cargo clippy --release --all-targets -- -D warnings

  rust-parity:
    name: Rust engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            engine-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine-rs/Cargo.lock') }}
      - name: Build Rust engine (native, release)
        working-directory: engine-rs
        run: cargo build --release
      - name: Check Python/Rust parity
        run: python tools/parity_check.py --iterations 10 --duration 45
      - name: Run native regression and full metric parity tests
        run: python -m unittest discover -s tests -t .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check committed browser WASM and worker merges
        run: python tools/wasm_parity.py
